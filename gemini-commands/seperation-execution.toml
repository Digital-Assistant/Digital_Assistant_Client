### **Provided Materials**

Context:

We have built a browser plugin based on Manifest V3.

The main functionality of this application is to record user clicks and then replay them on demand.

The application is built in ReactJS + Typescript with webpack build.

While we initially built this as a Manifest v3 plugin, we re-engineered this so that developers can integrate this directly in their application can be seen in this Readme.md

We want to make sure that this can be integrated into any js framework - React/Angular/Vue etc.

We noticed that each customer is looking to change the UI quite a bit. We decided to separate out the UI from the core functionality so that integrators/customers can build their own complete custom UI and just include our SDK for the functionality.

