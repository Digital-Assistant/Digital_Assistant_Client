*   **Directory Structure:** Follow the file and folder organization demonstrated in the POC for the new SDK.
*   **Dependency Choices:** Use the same libraries that are used in the POC for similar tasks (e.g., `jwt-decode` for token handling, `axios` for HTTP requests).

3.  **Sequential, Task-Based Execution:** You will work **sequentially**, one task at a time, as defined in the project plan. Do not combine tasks or jump ahead.

