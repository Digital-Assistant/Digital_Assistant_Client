version: 2
# Versions are locked (lockfiles). Routine version PRs are off (open-pull-requests-limit: 0);
# security updates still arrive (they need "Dependabot security updates" on in the repo
# settings) and use the commit prefix below so the PR title passes pr-title. Bump everything
# by hand in a planned window every 3 to 6 months: update everything, run scripts/ci locally,
# then Deploy to TEST.
updates:
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: monthly
    ignore:
      # Webpack 5.112.0 fails on the SDK bundle. Keep the pin until that is fixed.
      - dependency-name: webpack
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: quarterly
    groups:
      actions:
        patterns: ["*"]
