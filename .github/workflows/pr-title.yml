name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: ['dev', 'master']

permissions: {}

jobs:
  conventional-title:
    name: Conventional Commit Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must look like 'feat: add x' or 'fix(api): y' (types: feat, fix, perf, refactor, docs, test, build, ci, chore, revert)."
            exit 1
          fi
          echo "OK: $TITLE"
