name: Deploy to TEST

# Hands an existing dev build to testers. "Deploy" for the extension means: take the client-zip
# that CI built on dev, verify it, and publish it as GitHub prereleases (never a rebuild):
#   test-v<version>  one per build, kept;
#   test-current     fixed page testers bookmark; it moves to the build deployed last.
# Empty version: the newest dev build (scripts/ci/latest-client-build.sh). An older version
# redeploys it, which is the rollback. Testers load the zip unpacked (README, "Installing").
# Neither prerelease is ever marked latest. Runs only on dev. After publishing, job "Sanity check
# TEST" loads that same zip into Chromium (scripts/ci/smoke-extension.sh); a failure turns the run
# red but does not unpublish: redeploy the previous version to roll back.
#   gh workflow run deploy-test.yml --ref dev [-f version=X.Y.Z.N]

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Build to deploy, X.Y.Z.N (see the CI run summary). Empty: the newest dev build'
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: deploy-test-client
  cancel-in-progress: false

jobs:
  choose:
    name: Choose build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout; read package.json at the build commit
      actions: read # list dev CI runs and their artifacts
    outputs:
      run-id: ${{ steps.build.outputs.run-id }}
      version: ${{ steps.build.outputs.version }}
    steps:
      # Fail visibly instead of a job-level `if` (which only shows "skipped").
      - name: Refuse branches other than dev
        if: ${{ github.ref != 'refs/heads/dev' }}
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Deploy to TEST runs only on dev, not $REF"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find the build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          read -r run_id version < <(scripts/ci/latest-client-build.sh "$INPUT_VERSION")
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to testers
    needs: choose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the prereleases and tags, upload assets
      actions: read # download client-zip from the CI run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: client-zip
          run-id: ${{ needs.choose.outputs.run-id }}
          github-token: ${{ github.token }}
          path: build

      # Verifies SHA256SUMS, the version and that the commit is on dev, then creates or updates
      # the prereleases and writes the run summary. BASE_TEST_URL (public, org variable) only
      # tells the notes whether the bundle talks to TEST; it is never printed.
      - name: Publish prereleases
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ needs.choose.outputs.version }}
          BASE_TEST_URL: ${{ vars.BASE_TEST_URL }}
        run: scripts/ci/publish-test-build.sh build

      # The same files that were just verified and published, handed to the sanity job (not rebuilt).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deployed-zip
          path: |
            build/udan-extension-*.zip
            build/SHA256SUMS
            build/build-info.json
          retention-days: 1
          if-no-files-found: error

  sanity:
    name: Sanity check TEST
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # checkout the scripts and the pinned playwright-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deployed-zip
          path: zip

      # No lifecycle scripts: only playwright-core is needed, from the lockfile.
      - run: npm ci --ignore-scripts

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      # Unauthenticated and read-only. BASE_TEST_URL and BASE_PROD_URL are public variables, but
      # run logs of a public repo are public: the script prints "<test backend>", never the host.
      - name: Sanity check the extension
        env:
          BASE_TEST_URL: ${{ vars.BASE_TEST_URL }}
          BASE_PROD_URL: ${{ vars.BASE_PROD_URL }}
        run: |
          set -euo pipefail
          scripts/ci/smoke-extension.sh zip/udan-extension-*.zip "$BASE_TEST_URL"
