name: CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev]
  # The merge queue verifies PRs on a temporary merge-group ref: without this trigger the
  # required `CI Gate` check never reports there and every queued merge times out.
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Smallest default. Jobs ask for more only if they need it.
permissions: {}

env:
  NODE_VERSION: "22"
  GITLEAKS_VERSION: "8.30.1"

jobs:
  # Decides if the code changed. Docs-only changes skip the slow jobs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ] && [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" \
            | grep -Eqv '^(docs/|.*\.md$|LICENSE$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Build once: one immutable, identifiable extension zip per run (the Client's version of an
  # image digest). Later phases hand exactly this zip to testers and PROD, never a rebuild.
  # Artifact client-zip = out/udan-extension-<X.Y.Z.run>.zip (sideload) + the two Chrome Web Store
  # zips -store-test and -store-prod (same dist/, see package-extension.sh --store) + SHA256SUMS +
  # build-info.json.
  # No npm cache: this job produces the release artifact (same rule as the Server image build).
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - run: npm ci
      # Public build-time values only, from repository variables. Never map a secret here:
      # every value is inlined into the public extension. Unset variables give empty keys
      # (fork PRs get none; that is fine). Names: scripts/ci/generate-env.sh --print-names.
      - name: Generate build env
        env:
          BASE_PROD_URL: ${{ vars.BASE_PROD_URL }}
          BASE_TEST_URL: ${{ vars.BASE_TEST_URL }}
          TOKEN_PROD_URL: ${{ vars.TOKEN_PROD_URL }}
          TOKEN_TEST_URL: ${{ vars.TOKEN_TEST_URL }}
          LLM_PROD_URL: ${{ vars.LLM_PROD_URL }}
          LLM_TEST_URL: ${{ vars.LLM_TEST_URL }}
          KEYCLOAK_PROD_URL: ${{ vars.KEYCLOAK_PROD_URL }}
          KEYCLOAK_TEST_URL: ${{ vars.KEYCLOAK_TEST_URL }}
          KEYCLOAK_REALM: ${{ vars.KEYCLOAK_REALM }}
          KEYCLOAK_CLIENT_ID: ${{ vars.KEYCLOAK_CLIENT_ID }}
          KEYCLOAK_PUBLIC_CLIENT_ID: ${{ vars.KEYCLOAK_PUBLIC_CLIENT_ID }}
          KEYCLOAK_IDP_HINT: ${{ vars.KEYCLOAK_IDP_HINT }}
          GOOGLE_ANALYTICS_MEASUREMENT_ID: ${{ vars.GOOGLE_ANALYTICS_MEASUREMENT_ID }}
          ENABLE_GOOGLE_ANALYTICS: ${{ vars.ENABLE_GOOGLE_ANALYTICS }}
        run: scripts/ci/generate-env.sh --build production
      # Env check, clean build:prod, stamped manifest, build-info.json, deterministic zips (sideload
      # and the two store zips cut from the same dist/), SHA256SUMS; writes version, SHA256 and SDK
      # version to the run summary.
      - name: Build and pack the extension
        env:
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: scripts/ci/package-extension.sh --store --run-number "$RUN_NUMBER" --sha "$COMMIT_SHA"
      # Prints pass/FAIL lines, booleans and hashes only (public logs).
      - name: Check the store zips
        run: |
          set -euo pipefail
          v="$(jq -r .version out/build-info.json)"
          scripts/ci/check-store-zip.sh "out/udan-extension-${v}-store-test.zip" "out/udan-extension-${v}-store-prod.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-zip
          path: |
            out/udan-extension-*.zip
            out/SHA256SUMS
            out/build-info.json
          # 90 days for dev builds (testers and PROD take these), 14 for PR builds.
          retention-days: ${{ github.event_name == 'push' && 90 || 14 }}
          if-no-files-found: error

  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Store packaging tests
        run: scripts/ci/test-store-packaging.sh

  # Known: 11 high findings today (mostly indirect, fixable with `npm audit fix`).
  # Report-only until the owner decides; remove continue-on-error to make it block.
  audit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  # Always runs (secrets can hide in docs too). Scans only the new commits,
  # because the old history holds a known token (finding G3 in security-findings.md).
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$f"
          curl -fsSL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $f\$" checksums.txt | sha256sum -c -
          tar -xzf "$f" gitleaks
      - name: Scan new commits
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            ./gitleaks git --redact --verbose --log-opts="-1 $HEAD"
          else
            ./gitleaks git --redact --verbose --log-opts="$BASE..$HEAD"
          fi

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint + zizmor over the workflows, shellcheck over scripts/ci/*.sh.
      - name: Lint workflows and CI scripts
        run: scripts/ci/lint-workflows.sh

  # One name for branch protection (P09). Fails if any needed job failed or was
  # cancelled. "skipped" is fine: it means docs-only changes.
  ci-gate:
    name: CI Gate
    if: always()
    needs: [changes, build, typecheck, audit, gitleaks, workflow-lint]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case "$RESULTS" in *failure*|*cancelled*) exit 1;; esac
